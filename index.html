 0 10px rgba(0,240,255,.7),0 0 20px rgba(0,240,255,.4)}.text-glow-red{text-shadow:0 0 10px rgba(255,42,85,.8)}@keyframes pulseGlow{0%,100%{box-shadow:0 0 15px rgba(0,240,255,.4),inset 0 0 10px rgba(0,240,255,.2)}50%{box-shadow:0 0 30px rgba(0,240,255,.8),inset 0 0 20px rgba(0,240,255,.4)}}.animate-pulse-glow{animation:pulseGlow 2.5s infinite ease-in-out}@keyframes pulseRed{0%,100%{border-color:rgba(255,42,85,.6);box-shadow:0 0 15px rgba(255,42,85,.4)}50%{border-color:rgba(255,42,85,1);box-shadow:0 0 28px rgba(255,42,85,.9)}}.animate-pulse-red{animation:pulseRed 1.8s infinite ease-in-out}@keyframes rotateHub{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.animate-rotate-slow{animation:rotateHub 25s linear infinite}#dnaCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:.35;z-index:0}.hold-progress-ring{transition:stroke-dashoffset .1s linear}.auth-card,.health-card,.appointment-card,.list-card,.record-card,.medicine-card,.doctor-card,.large-card,.hospital-card,.qr-card,.profile-card,.help-card,.modal-card,.chat-card,.staff-health,.staff-grid button{background:rgba(6,20,43,.85)!important;backdrop-filter:blur(16px);border:1px solid rgba(0,240,255,.2)!important;color:#e2e8f0!important;box-shadow:0 8px 30px rgba(0,0,0,.5)}.auth-card h2,.auth-card h1,.page-header h1,.welcome h1,h2,h3{color:#fff!important}.subtitle,.page-header p,.welcome p,.auth-card label,.health-card span,.appointment-card p,.list-info p,.record-card p,.medicine-card p,.doctor-card p,.qr-card p,.profile-card p,.help-card p{color:#94a3b8!important}.input-box{background:rgba(2,6,23,.8)!important;border:1px solid rgba(0,240,255,.3)!important}.input-box input,.input-box select,.input-box textarea{color:#fff!important}.primary-btn{background:linear-gradient(to right,#00f0ff,#00ffa3)!important;color:#030a16!important;font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:1px}.primary-btn:hover{opacity:.9;box-shadow:0 0 15px rgba(0,240,255,.5)}.top-header,.bottom-nav,.staff-header{background:rgba(3,10,22,.9)!important;backdrop-filter:blur(12px);border-color:rgba(0,240,255,.2)!important}.bottom-nav button,.bottom-nav i{color:#94a3b8!important}.bottom-nav button:hover,.bottom-nav button.active{color:#00f0ff!important}.top-header .brand strong,.staff-header .brand strong{color:#00f0ff!important;font-family:'Orbitron',sans-serif}.date-box{background:rgba(0,240,255,.15)!important;color:#00f0ff!important;border:1px solid rgba(0,240,255,.3)}.quick-grid button{background:rgba(6,20,43,.85);border:1px solid rgba(0,240,255,.2)}.quick-grid button span{color:#e2e8f0}.chat-input{background:rgba(2,6,23,.9);border-top:1px solid rgba(0,240,255,.2)}.chat-input input{background:transparent;color:#fff}.bot-message{background:rgba(0,240,255,.15);color:#e2e8f0}.photo-viewable,.logo-icon img,.brand>div:first-child img{cursor:zoom-in;touch-action:none}#erecpassImageViewer{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.92)}#erecpassImageViewer.active{display:flex}#erecpassImageViewer img{max-width:94vw;max-height:82vh;object-fit:contain;transform-origin:center center;user-select:none;-webkit-user-drag:none;touch-action:none;cursor:grab}#erecpassImageViewer img:active{cursor:grabbing}.erecpass-viewer-toolbar{position:absolute;top:14px;right:14px;display:flex;gap:8px;z-index:2}.erecpass-viewer-toolbar button{min-width:42px;min-height:42px;border-radius:12px;border:1px solid rgba(0,240,255,.4);background:rgba(3,10,22,.9);color:#00f0ff;font-family:'Orbitron',sans-serif;font-weight:700}.erecpass-viewer-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#cbd5e1;font-size:12px;text-align:center;background:rgba(3,10,22,.78);border:1px solid rgba(0,240,255,.2);border-radius:12px;padding:8px 12px;pointer-events:none}.login-area-large .input-box{min-height:52px;padding-top:13px!important;padding-bottom:13px!important}.login-area-large label,.login-area-large input{font-size:15px!important}.login-area-large .primary-btn{min-height:54px;font-size:15px!important}.login-area-large .logo-icon,.login-area-large .logo-icon img{width:56px!important;height:56px!important}.erecpass-chat-message-wrap{position:relative;display:flex;align-items:flex-end;gap:6px;touch-action:pan-y;user-select:none;-webkit-user-select:none}.erecpass-delete-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex:0 0 28px;border:1px solid rgba(229,57,53,.28);border-radius:8px;background:rgba(229,57,53,.08);color:#e53935;font-size:12px;cursor:pointer;opacity:.9;transition:all .15s ease}.erecpass-delete-btn:hover{background:rgba(229,57,53,.16);transform:scale(1.04)}.erecpass-delete-btn:active{transform:scale(.96)}.erecpass-delete-btn i{pointer-events:none}</style><!-- ERECPASS THEME UPDATE ONLY: MEDICAL DIAGNOSTICS TEAL THEME --><style>:root{--blue:#2de0d0!important;--dark-blue:#031a1d!important;--background:#021417!important;--white:#f4fffd!important;--text:#d9f7f3!important;--muted:#8fb9b5!important;--border:rgba(45,224,208,.28)!important;--green:#5fffd0!important;--green-bg:rgba(95,255,208,.1)!important;--yellow:#f4d35e!important;--yellow-bg:rgba(244,211,94,.1)!important;--red:#ff5575!important;--red-bg:rgba(255,85,117,.14)!important;--shadow:0 0 30px rgba(45,224,208,.12),inset 0 0 18px rgba(45,224,208,.035)!important}html,body{background:#021417!important;color:var(--text)!important}body{background-image:radial-gradient(circle at 76% 18%,rgba(45,224,208,.16) 0,rgba(45,224,208,0) 28%),radial-gradient(circle at 18% 42%,rgba(0,190,178,.14) 0,rgba(0,190,178,0) 30%),radial-gradient(circle at 52% 82%,rgba(32,132,145,.12) 0,rgba(32,132,145,0) 34%),linear-gradient(135deg,#021417 0%,#062a2d 48%,#021417 100%)!important;background-attachment:fixed!important}body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.42;background-image:radial-gradient(circle at 12% 18%,rgba(110,255,236,.55) 0 1px,transparent 2px),radial-gradient(circle at 78% 30%,rgba(110,255,236,.45) 0 1px,transparent 2px),radial-gradient(circle at 64% 76%,rgba(110,255,236,.38) 0 1px,transparent 2px),radial-gradient(circle at 32% 70%,rgba(110,255,236,.32) 0 1px,transparent 2px);background-size:170px 170px,230px 230px,210px 210px,190px 190px}body>*{position:relative;z-index:1}</style></head><body><div id="app"></div><script src="./app.js"></script><script src="./medication-reminders.js"></script></body></html>
